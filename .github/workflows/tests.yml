name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest -q
      # The packaged default config must ship inside the wheel — the model has
      # no fallback copy of it, so a missing package-data entry breaks any
      # install that is not editable.
      - run: |
          pip wheel --no-deps -w /tmp/wheel .
          python -m zipfile -l /tmp/wheel/*.whl | grep default_config.yaml
      - run: python examples/quickstart.py /tmp/example_out
